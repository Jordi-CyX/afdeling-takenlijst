<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F99D27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zeiklijst">
  <meta name="description" content="Zeiklijst Live — takenlijst voor intern afdelingsgebruik">
  <title>Zeiklijst Live</title>
  <link rel="manifest" href="manifest.webmanifest?v=17">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=17">
  <link rel="icon" href="favicon.ico?v=17" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=17">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body class="guest-app is-maintenance">
  <header>
    <div class="header-inner">
      <h1>Zeiklijst Live</h1>
    </div>
  </header>

  <main id="maintenance" class="maintenance-screen">
    <div class="login-screen-card staff-login-card maintenance-card">
      <img src="logo.png?v=17" alt="" class="maintenance-logo" width="120" height="120">
      <h2>Tijdelijk niet beschikbaar wegens onderhoud</h2>
    </div>
  </main>

  <script src="app-version.js?v=17"></script>
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;
      var reloadKey = "zl-sw-reloaded-v17";
      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (reloading) return;
        if (sessionStorage.getItem(reloadKey)) return;
        reloading = true;
        sessionStorage.setItem(reloadKey, "1");
        location.reload();
      });
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    })();
  </script>
</body>
</html>
