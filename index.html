<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF7A00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zeiklijst">
  <meta name="description" content="Zeiklijst Live — takenlijst voor intern afdelingsgebruik">
  <title>Zeiklijst Live</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Zeiklijst Live</h1>
    </div>
  </header>

  <main>
    <section>
      <h2>Openstaande taken</h2>
      <div id="task-list"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button type="button" class="close" id="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-assignee"></p>
      <div id="modal-status"></div>
      <div id="modal-description"></div>
      <div id="modal-photos"></div>
      <div id="tick-by-row" class="hidden">
        <label>
          Afgevinkt door (optioneel)
          <select id="tick-by-select">
            <option value="">— Geen naam —</option>
          </select>
        </label>
      </div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="app.js?v=5"></script>
</body>
</html>
