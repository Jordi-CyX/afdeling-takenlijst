<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F99D27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zeiklijst">
  <meta name="description" content="Zeiklijst Live — takenlijst voor intern afdelingsgebruik">
  <title>Zeiklijst Live</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body class="guest-app">
  <header>
    <div class="header-inner">
      <h1>Zeiklijst Live</h1>
      <div class="header-actions">
        <div class="view-toggle" role="group" aria-label="Weergave">
          <button type="button" id="view-list" class="view-btn" aria-pressed="true" aria-label="Lijstweergave" title="Lijstweergave">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2.5H4V6zm0 4.75h16v2.5H4v-2.5zm0 4.75h16V18H4v-2.5z"/></svg>
          </button>
          <button type="button" id="view-tiles" class="view-btn" aria-pressed="false" aria-label="Tegelweergave" title="Tegelweergave">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
          </button>
        </div>
        <div class="header-more">
          <button type="button" id="header-more-btn" class="header-more-btn" aria-expanded="false" aria-haspopup="true" aria-controls="header-more-menu" aria-label="Meer opties" title="Meer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>
          <div id="header-more-menu" class="header-more-menu hidden" role="menu">
            <a href="admin/" class="admin-menu-link" role="menuitem" aria-label="Naar Zeiklijst Admin">
              <img src="admin/icons/icon-192.png" alt="" width="24" height="24">
              <span>Zeiklijst Admin</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="filter-chips" class="filter-chips" role="toolbar" aria-label="Filter taken">
      <button type="button" class="chip" data-filter="all">Alles</button>
      <button type="button" class="chip" data-filter="mine">Mijn taken</button>
      <button type="button" class="chip" data-filter="allen">Allen</button>
      <button type="button" class="chip" data-filter="unassigned">Niet toegewezen</button>
      <button type="button" class="chip" data-filter="pending">Ter controle</button>
    </div>
    <p id="filter-hint" class="filter-hint hidden"></p>
    <section id="section-open" class="task-section">
      <h2 id="heading-open">Openstaande taken</h2>
      <div id="task-list" class="task-list"></div>
    </section>
    <section id="section-pending" class="task-section">
      <h2 id="heading-pending">Ter controle</h2>
      <div id="pending-list" class="task-list"></div>
    </section>
    <p id="board-empty" class="empty-state hidden">Geen taken in dit filter.</p>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button type="button" class="close" id="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-location" hidden></p>
      <p id="modal-assignee"></p>
      <div id="modal-status"></div>
      <div id="modal-rejection" class="rejection-note hidden"></div>
      <div id="modal-description"></div>
      <div id="modal-photos"></div>
      <div id="tick-by-row" class="hidden">
        <label>
          Afgevinkt door (optioneel)
          <select id="tick-by-select">
            <option value="">— Geen naam —</option>
          </select>
        </label>
      </div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Foto">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Sluiten">&times;</button>
    <img id="lightbox-img" alt="Foto bij taak">
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=12"></script>
</body>
</html>
